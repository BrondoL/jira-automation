<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 p-10 min-h-screen flex flex-col justify-center justify-items-center">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold text-green-600">Accept Ticket</h1>
    <p class="mt-4 text-lg">Please confirm that you want to accept this ticket and create a Jira issue.</p>

    <div class="mt-6 p-4 bg-gray-100 rounded-lg">
      <p class="text-sm"><strong>Summary</strong>: {{ response['Summary'] }}</p>
      <p class="text-sm"><strong>Assignee</strong>: {{ response['Assignee'] }}</p>
      <p class="text-sm"><strong>Reporter</strong>: {{ response['Reporter'] }}</p>
      <p class="text-sm"><strong>Priority</strong>: {{ response['Priority'] }}</p>
      <p class="text-sm"><strong>Description</strong>: {{ response['Description'] }}</p>
    </div>

    <form method="POST" class="mt-6">
      <div class="flex space-x-3">
        <button
          type="submit"
          class="px-6 py-2 bg-green-600 text-white font-medium rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
        >
          Confirm & Accept Ticket
        </button>
        <button
          type="button"
          onclick="window.history.back()"
          class="px-6 py-2 bg-gray-300 text-gray-700 font-medium rounded-md hover:bg-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
        >
          Cancel
        </button>
      </div>
    </form>
  </div>
</body>

</html>
